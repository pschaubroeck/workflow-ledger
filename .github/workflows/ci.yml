name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r test-requirements.txt
      - run: python -m pytest

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt '.[dev]'
      - run: python -m ruff check src tests benchmarks examples plugins tools

  package-smoke:
    name: Build and installed package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt '.[dev]'
      - run: python -m build
      - run: python -m venv .package-smoke-env
      - run: .package-smoke-env/bin/python -m pip install dist/*.whl
      - run: .package-smoke-env/bin/workflow-ledger --help
      - run: .package-smoke-env/bin/workflow-ledger-marker --help
      - run: .package-smoke-env/bin/python tools/package_smoke.py --cli .package-smoke-env/bin/workflow-ledger
      - run: python tools/package_plugin.py --output /tmp/workflow-ledger-plugin.zip --format codex
