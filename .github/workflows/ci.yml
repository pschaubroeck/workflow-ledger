name: CI

on:
  push:
    branches: [main]
  create:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/tags/v')
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r test-requirements.txt
      - run: python -m pytest

  lint:
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/tags/v')
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt '.[dev]'
      - run: python -m ruff check src tests benchmarks examples plugins tools

  package-smoke:
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/tags/v')
    name: Build and installed package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt '.[dev]'
      - run: python -m build
      - run: python -m venv .package-smoke-env
      - run: .package-smoke-env/bin/python -m pip install dist/*.whl
      - run: .package-smoke-env/bin/workflow-ledger --help
      - run: .package-smoke-env/bin/workflow-ledger-marker --help
      - run: .package-smoke-env/bin/python tools/package_smoke.py --cli .package-smoke-env/bin/workflow-ledger
      - run: python tools/package_plugin.py --output /tmp/workflow-ledger-plugin.zip --format codex

  release:
    if: github.event_name == 'create' && startsWith(github.ref, 'refs/tags/v')
    needs: [tests, lint, package-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt '.[dev]'
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Create a draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Workflow Ledger $GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Attach package files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Publish after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
