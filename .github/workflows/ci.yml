name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.3.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r test-requirements.txt
      - run: python -m pytest

  lint:
    name: Ruff
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt '.[dev]'
      - run: python -m ruff check src tests benchmarks examples plugins tools

  package-smoke:
    name: Build and installed package smoke
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt '.[dev]'
      - run: python -m build
      - run: python -m venv .package-smoke-env
      - run: .package-smoke-env/bin/python -m pip install dist/*.whl
      - run: .package-smoke-env/bin/workflow-ledger --help
      - run: .package-smoke-env/bin/workflow-ledger-marker --help
      - run: .package-smoke-env/bin/python tools/package_smoke.py --cli .package-smoke-env/bin/workflow-ledger
      - run: python tools/package_plugin.py --output /tmp/workflow-ledger-plugin.zip --format codex

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [tests, lint, package-smoke]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate release request and create local version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run the release workflow from main."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists. Choose a new version."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release for ${RELEASE_TAG} already exists. Choose a new version."
            exit 1
          fi
          git tag -a "$RELEASE_TAG" -m "Workflow Ledger ${RELEASE_TAG#v}" "$GITHUB_SHA"
      - name: Install build and publication tools
        run: python -m pip install -r requirements.txt '.[dev]'
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Create GitHub Release with package files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: gh release create "$RELEASE_TAG" dist/* --title "Workflow Ledger $RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
